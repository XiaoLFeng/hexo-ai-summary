<div class="ai-summary-entry" id="ai-summary-entry">
    <article class="ai-summary-card is-idle is-collapsed" id="ai-summary-card" role="button" tabindex="0" aria-expanded="false">
        <div class="ai-summary-card__header" id="ai-summary-card-header">
            <span class="ai-summary-card__title" id="ai-summary-card-title">此方给你来生成一个摘要</span>
            <span class="ai-summary-card__actions" id="ai-summary-card-actions">
                <button type="button" class="ai-summary-card__regenerate" id="ai-summary-card-regenerate">重新生成（AI 摘要已过期）</button>
                <span class="ai-summary-card__chevron" id="ai-summary-card-chevron" aria-hidden="true"></span>
            </span>
        </div>
        <div class="ai-summary-card__content-wrap" id="ai-summary-card-content-wrap" hidden>
            <div class="ai-summary-card__meta" id="ai-summary-card-meta" hidden>数据来源：缓存</div>
            <div class="ai-summary-card__content" id="ai-summary-card-content"></div>
            <span class="ai-summary-card__cursor" id="ai-summary-card-cursor" aria-hidden="true"></span>
        </div>
    </article>
</div>
